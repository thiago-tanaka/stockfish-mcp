; Production settings. opcache carries the most weight: without it PHP recompiles every
; file on every request.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
; Code does not change inside an image, so there is nothing to revalidate against disk.
opcache.validate_timestamps=0

memory_limit=256M
max_execution_time=60

expose_php=Off
display_errors=Off
log_errors=On
error_log=/dev/stderr
