# Applied automatically by `docker compose` when present, which makes this the development
# file. In production it is absent (or docker-compose.yml is named explicitly with -f) and
# the base file stands alone.
#
# Three things differ from production: the image is built here instead of pulled from the
# registry, the code is mounted from disk so a change does not need a rebuild, and the
# database and Redis are reachable from the host for inspection.

services:
  app:
    build:
      context: .
      target: app
    image: stockfish-mcp:dev
    # phpdotenv does not overwrite a variable that already exists in the environment, so
    # what is set here wins over the host's .env. That is what lets a single .env serve both
    # the native run on the host (Stockfish in ~/.local/bin, SQLite) and the containers,
    # with nothing to edit when switching between them.
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      # The host UID has no entry in the image's /etc/passwd, so HOME would be "/", which
      # nothing may write to. Tools that keep state in the home directory -- psysh, behind
      # artisan tinker -- fail on that.
      HOME: /tmp
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      STOCKFISH_PATH: /usr/local/bin/stockfish
    volumes:
      # Host code over the image: editing a file takes effect on the next request.
      - .:/var/www/html
      # Volume lists are merged across compose files, deduplicated by target path -- not
      # replaced. Declaring the same target here is what cancels the base file's named
      # volumes, which in production carry state across deploys and here would only get in
      # the way: they are created owned by www-data while the container runs as your UID.
      - ./storage:/var/www/html/storage
      # Read-only on purpose: the entrypoint tests whether /srv/public is writable to decide
      # whether to copy public/ into it. In development it must not -- Caddy already reads
      # ./public from disk -- and a writable bind would make the copy run over itself.
      - ./public:/srv/public:ro
    user: "${UID:-1000}:${GID:-1000}"

  worker:
    build:
      context: .
      target: app
    image: stockfish-mcp:dev
    environment:
      APP_ENV: local
      HOME: /tmp
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: database
      STOCKFISH_PATH: /usr/local/bin/stockfish
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    user: "${UID:-1000}:${GID:-1000}"

  web:
    environment:
      # With no domain, Caddy serves plain HTTP and does not attempt a certificate.
      SITE_ADDRESS: ":80"
    ports:
      - "8080:80"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Same target as the base file, so it replaces the named volume: in development Caddy
      # reads public/ straight from disk and a change takes effect immediately.
      - ./public:/var/www/html/public:ro

  # Runs the suite with an environment of its own, which is why it is a service and not an
  # `exec` into app.
  #
  # A container's environment takes precedence over .env -- the right behaviour in
  # production, and the problem here: `exec app vendor/bin/phpunit` would inherit
  # APP_ENV=local, CACHE_STORE=redis and the real MySQL, and the suite would start depending
  # on their state. force="true" in phpunit.xml does not settle it either, because Laravel's
  # env() reads from the Dotenv repository, which the environment has already populated.
  #
  #   docker compose run --rm test
  #
  test:
    build:
      context: .
      target: app
    image: stockfish-mcp:dev
    profiles: ["test"]
    environment:
      APP_ENV: testing
      APP_DEBUG: "true"
      HOME: /tmp
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      BCRYPT_ROUNDS: "4"
      STOCKFISH_PATH: /usr/local/bin/stockfish
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
    user: "${UID:-1000}:${GID:-1000}"
    command: vendor/bin/phpunit

  # Exposed only for inspection from the host (a database client, redis-cli). High ports on
  # purpose: 3307 and 6380 are often already taken, and Docker Desktop fails the whole `up`
  # when one of them is.
  mysql:
    ports:
      - "13306:3306"

  redis:
    ports:
      - "16379:6379"
