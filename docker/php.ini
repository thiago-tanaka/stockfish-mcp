; Ajustes de produção. O opcache é o que mais pesa: sem ele o PHP recompila cada arquivo
; a cada requisição.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=64
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
; O código não muda dentro de uma imagem, então não há por que checar o disco.
opcache.validate_timestamps=0

memory_limit=256M
max_execution_time=60

expose_php=Off
display_errors=Off
log_errors=On
error_log=/dev/stderr
