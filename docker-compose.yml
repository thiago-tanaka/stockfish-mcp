# The production definition. docker-compose.override.yml, applied automatically in
# development, is what swaps the image for a local build and mounts the code.

services:
  app:
    image: ${APP_IMAGE:-ghcr.io/thiago-tanaka/stockfish-mcp:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Only this service migrates; the worker uses the database it already migrated.
      RUN_MIGRATIONS: "true"
    volumes:
      - app-storage:/var/www/html/storage
      # Caddy needs to see public/ to resolve try_files before handing off to FPM, but the
      # code lives inside the image. The entrypoint copies public/ here on each start, so a
      # deploy with new files updates what Caddy serves.
      - app-public:/srv/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  # Same image, different command. The worker is a separate process because its usage
  # profile is the opposite: the web side serves short bursts, the worker holds a core for
  # minutes.
  worker:
    image: ${APP_IMAGE:-ghcr.io/thiago-tanaka/stockfish-mcp:latest}
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work --queue=default --sleep=3 --tries=1 --timeout=1800 --memory=256
    volumes:
      - app-storage:/var/www/html/storage
    # Docker sends SIGTERM and waits: room for the worker to finish the analysis in flight
    # instead of being killed halfway through it.
    stop_grace_period: 1m
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      # Same path the app uses: the SCRIPT_FILENAME Caddy builds has to match the real path
      # of the file inside the PHP container.
      - app-public:/var/www/html/public:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

  # 9.7, not 8.4 or 26.7: 9.7 is the current LTS (supported to April 2034), 8.4 is the
  # previous one (April 2032), and the 26.x calendar-versioned releases are Innovation --
  # supported only until the next quarterly ships, which is the wrong trade for a database.
  mysql:
    image: mysql:9.7
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-stockfish_mcp}
      MYSQL_USER: ${DB_USERNAME:-stockfish}
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # This is what makes the other services' depends_on wait for the database to accept
      # connections, rather than merely for the process to have started.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # The position cache is reproducible: if Redis restarts, the worst outcome is that the
    # next analysis is slow. Not worth paying fsync for.
    command: redis-server --save "" --appendonly no --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
  caddy-data:
  caddy-config:
  app-storage:
  app-public:
